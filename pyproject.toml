[project]
name = "dsia-dataset"
version = "0.1.0"
description = "Dataset horario de demanda eléctrica + meteorología en España (Energy-Charts + Open-Meteo) exportado a CSV."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "holidays>=0.50",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "tenacity>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests que llaman a las APIs reales (ejecutar con -m integration)",
]
